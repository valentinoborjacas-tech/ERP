<div class="module-title">Materia Prima</div>
<div class="module-subtitle">Stock de bovinas por material — ingresos, consumos y saldo actual.</div>

<div class="search-bar">
  <div class="search-input-wrap">
    <span>🔍</span>
    <input type="text" id="mp-search-input" placeholder="Buscar por ID o descripción..." />
  </div>
  <button class="btn-classic btn-primary" id="btn-ingresar-bovinas">+ Ingresar Bovinas</button>
</div>

<!-- Panel: ingresar bovinas -->
<div class="quick-panel" id="mp-ingreso-panel">
  <div class="quick-panel-header">
    <span class="quick-panel-title">Ingresar bovinas</span>
    <span class="quick-panel-close" id="mp-ingreso-close">✕ Cerrar</span>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
    <div>
      <label class="field-label">Código de material</label>
      <input class="input-classic" id="mp-codigo" placeholder="Ej. MP-001" />
    </div>
    <div>
      <label class="field-label">Descripción</label>
      <input class="input-classic" id="mp-descripcion" disabled style="background:#f0f0f0;" />
    </div>
    <div>
      <label class="field-label">N° de bovinas</label>
      <input type="number" class="input-classic" id="mp-cantidad-bovinas" value="1" min="1" />
    </div>
    <div>
      <label class="field-label">Proveedor</label>
      <input class="input-classic" id="mp-proveedor" />
    </div>
    <div>
      <label class="field-label">Almacenero</label>
      <input class="input-classic" id="mp-almacenero" />
    </div>
  </div>
  <div id="mp-pesos-container"></div>
  <div class="flex justify-end gap-2 mt-3">
    <button class="btn-classic btn-primary" id="mp-ingreso-confirm">✔ Registrar ingreso</button>
  </div>
</div>

<!-- Panel: detalle de bovinas de un material -->
<div class="quick-panel" id="mp-bovinas-panel">
  <div class="quick-panel-header">
    <span class="quick-panel-title">Bovinas de <span id="mp-bovinas-material">—</span></span>
    <span class="quick-panel-close" id="mp-bovinas-close">✕ Cerrar</span>
  </div>
  <div class="table-scroll" style="max-height:280px;">
    <table class="data-grid">
      <thead><tr><th>ID Bovina</th><th>Proveedor</th><th>Peso inicial</th><th>Peso actual</th><th>Corridas</th><th>Estado</th></tr></thead>
      <tbody id="mp-bovinas-tbody"></tbody>
    </table>
  </div>
</div>

<div class="table-scroll">
  <table class="data-grid" id="mp-table">
    <thead>
      <tr><th>ID</th><th>Descripción</th><th>N° Bovinas</th><th>Kg ingresados</th><th>Kg consumidos</th><th>Stock actual (kg)</th></tr>
    </thead>
    <tbody id="mp-tbody"><tr><td colspan="6">Cargando…</td></tr></tbody>
  </table>
</div>
