<div style="padding:12px;">
  <h2 style="font-weight:bold;font-size:16px;margin-bottom:2px;">Importar mangas desde Excel</h2>
  <p style="font-size:12px;color:#555;margin-bottom:10px;">Una fila por manga: columnas <b>ID_BOVINA</b> (código, ej. Z3310CFB) y <b>PESO_KG</b>.</p>

  <div class="groupbox" style="padding:10px;margin-bottom:10px;">
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
      <div>
        <label class="field-label">Archivo Excel</label><br>
        <input type="file" id="imp-file" accept=".xlsx,.xls,.csv" class="input-classic" />
      </div>
      <div>
        <label class="field-label">Almacenero <span class="required-mark">*</span></label><br>
        <select id="imp-almacenero" class="input-classic">
          <option value="">— Selecciona —</option>
          <option>Jacky</option>
          <option>Valentino</option>
        </select>
      </div>
      <div>
        <label class="field-label">Proveedor</label><br>
        <select id="imp-proveedor" class="input-classic">
          <option value="">— (opcional) —</option>
          <option>GIO PLAST</option>
          <option>ELVIS</option>
          <option>HUAMANI</option>
        </select>
      </div>
      <button type="button" id="imp-plantilla" class="btn-classic">⬇ Descargar plantilla</button>
    </div>
  </div>

  <div id="imp-resumen" style="font-size:13px;margin-bottom:6px;"></div>

  <div class="table-scroll" style="max-height:340px;">
    <table class="data-grid">
      <thead><tr><th>#</th><th>ID de bovina</th><th>Descripción</th><th>Peso (kg)</th><th>Estado</th></tr></thead>
      <tbody id="imp-tbody"><tr><td colspan="5">Sube un archivo para ver la vista previa.</td></tr></tbody>
    </table>
  </div>

  <div style="margin-top:10px;">
    <button type="button" id="imp-confirmar" class="btn-ingreso" disabled>✔ Importar mangas válidas</button>
  </div>
</div>
