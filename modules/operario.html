<div class="module-title">Producción — Operario</div>
<div class="module-subtitle">Elige tu nombre, inicia una manga y ciérrala al terminar.</div>

<!-- Paso 0: quién eres -->
<div id="op-selector" class="quick-panel show">
  <div class="quick-panel-header"><span class="quick-panel-title">¿Quién eres?</span></div>
  <select class="input-classic" id="op-select" style="min-height:48px; font-size:16px;">
    <option value="">— Selecciona —</option>
    <option value="HECTOR">HECTOR</option>
    <option value="MAURO">MAURO</option>
    <option value="SAMIR">SAMIR</option>
    <option value="NELSON">NELSON</option>
    <option value="ERIKA">ERIKA</option>
    <option value="GRACIELA">GRACIELA</option>
    <option value="__otro__">Otro (escribir nombre)...</option>
  </select>
  <input class="input-classic" id="op-otro" placeholder="Escribe tu nombre" style="margin-top:6px; display:none;" />
  <div class="flex justify-end mt-3">
    <button class="btn-classic btn-primary" id="op-confirmar" style="min-height:48px;">Continuar</button>
  </div>
</div>

<div id="op-main" style="display:none;">
  <div class="text-center py-1" style="margin-bottom:10px;">
    Operario: <b id="op-nombre">—</b> —
    <a id="op-cambiar" style="cursor:pointer; color:#2a5db0; text-decoration:underline;">cambiar</a>
  </div>

  <!-- Iniciar una manga -->
  <div id="op-panel-iniciar" class="groupbox" style="margin-bottom:14px;">
    <span class="groupbox-label">Iniciar manga</span>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
      <div>
        <label class="field-label">Código de material</label>
        <input class="input-classic" id="op-codigo" placeholder="Ej. A2020SFB" autocomplete="off" />
      </div>
      <div>
        <label class="field-label">Manga disponible</label>
        <select class="input-classic" id="op-bovina">
          <option value="">— Escribe el código del material —</option>
        </select>
      </div>
      <div><label class="field-label">Litros</label><input type="number" class="input-classic" id="op-litros" min="0" step="0.01" /></div>
      <div><label class="field-label">Ancho</label><input type="number" class="input-classic" id="op-ancho" min="0" step="0.01" /></div>
      <div><label class="field-label">Largo</label><input type="number" class="input-classic" id="op-largo" min="0" step="0.01" /></div>
      <div><label class="field-label">Espesor</label><input type="number" class="input-classic" id="op-espesor" min="0" step="0.01" /></div>
      <div><label class="field-label">Millares</label><input type="number" class="input-classic" id="op-millares" min="0" step="0.01" /></div>
    </div>
    <button class="btn-classic btn-ingreso" id="op-iniciar" style="min-height:56px; font-size:18px; font-weight:bold; width:100%;">▶ Iniciar</button>
  </div>

  <!-- Tarea activa -->
  <div id="op-panel-activa" class="groupbox" style="margin-bottom:14px; display:none;">
    <span class="groupbox-label">Tarea en proceso</span>
    <div style="font-size:16px; margin-bottom:10px;">
      Manga <b id="op-act-manga">—</b> · Material <b id="op-act-material">—</b><br>
      <span id="op-act-detalle" style="font-size:13px; color:#555;"></span>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
      <div><label class="field-label">Peso manga inicio (kg)</label><input type="number" class="input-classic" id="op-peso-inicio" min="0" step="0.01" /></div>
      <div><label class="field-label">Peso tuco (kg)</label><input type="number" class="input-classic" id="op-peso-tuco" min="0" step="0.01" /></div>
      <div>
        <label class="field-label">Estado final</label>
        <select class="input-classic" id="op-estado-final">
          <option value="Terminado">Terminado</option>
          <option value="No terminado">No terminado</option>
        </select>
      </div>
    </div>
    <div class="text-center py-1" style="font-weight:bold; margin-bottom:10px;">
      Peso utilizado: <span id="op-peso-utilizado">0.00</span> kg ·
      Merma (tuco): <span id="op-merma">0.00</span> kg (<span id="op-merma-pct">0.0</span>%)
    </div>
    <button class="btn-classic btn-produccion" id="op-terminar" style="min-height:56px; font-size:18px; font-weight:bold; width:100%;">■ Terminar</button>
  </div>
</div>
